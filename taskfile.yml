# THE CI CONTRACT — generated per repo; `task ci` is what CI runs and what you run locally. Rationale: github-actions-align/templates/README.md#taskfiles
version: '3'

includes:
  repo:
    taskfile: .taskfiles/repo.yml

  # --- generated: one entry per language present; `dir:` for non-Go ---
  go:
    taskfile: .taskfiles/go.yml

  node:
    taskfile: .taskfiles/node.yml
    dir: web

  python:
    taskfile: .taskfiles/python.yml
    dir: radar

tasks:
  default:
    desc: List all tasks
    cmds:
      - task --list

  ci:
    desc: Everything CI runs. Run this before pushing.
    cmds:
      - task: repo:ci
      - task: go:ci
      - task: node:ci
      - task: python:ci

  lint:
    desc: Static checks only
    cmds:
      - task: repo:ci
      - task: go:lint
      - task: node:lint
      - task: python:lint

  test:
    desc: Tests only
    cmds:
      - task: go:test
      - task: node:test
      - task: python:test

  build:
    desc: Build artefacts
    cmds:
      # node BEFORE go, and not merely by preference: web/embed.go carries
      # `//go:embed all:dist`, so the Go binary embeds whatever web/dist holds at
      # compile time. Build Go first and you ship the previous UI (or, on a clean
      # checkout, just the tracked .gitkeep).
      - task: node:build
      - task: go:build

  # Service repo. Runs locally: IMAGE=ghcr.io/jacaudi/stormglass:vX.Y.Z task smoke
  smoke:
    desc: Boot the built image and assert it behaves
    requires:
      vars: [IMAGE]
    # Accepts BOTH `IMAGE=… task smoke` and `task smoke IMAGE=…`. Without this,
    # the CLI form satisfies `requires` but leaves $IMAGE empty in the shell.
    env:
      IMAGE: '{{.IMAGE}}'
    cmds:
      - |
        set -eu
        echo "smoke testing ${IMAGE}"
        # Boot exactly the way README's quickstart tells users to: a named
        # volume at /data, SQLite at its default path, no SQLITE_PATH override.
        # SQLite is the DEFAULT store and the process EXITS ON STARTUP if it
        # cannot open the database, so this asserts the image ships a /data its
        # own unprivileged user can write -- the failure mode in #226, where a
        # fresh named volume mounts root-owned against USER 65532.
        SMOKE_VOL="smoke-data-$$"
        docker volume create "${SMOKE_VOL}" >/dev/null
        docker run -d --name smoke \
          -p 8080:8080 \
          -v "${SMOKE_VOL}":/data \
          "${IMAGE}"
        trap 'docker logs smoke || true; docker rm -f smoke >/dev/null 2>&1 || true; docker volume rm "${SMOKE_VOL}" >/dev/null 2>&1 || true' EXIT
        for i in $(seq 1 30); do
          curl -sf http://localhost:8080/healthz >/dev/null && break
          [ "$i" = "30" ] && { echo "::error::container never served /healthz on :8080"; exit 1; }
          sleep 2
        done
        echo "ok: container serves /healthz"
        # The UI is embedded via //go:embed, so a 200 on / proves the Vite build
        # actually reached the binary — the one failure `go build` cannot catch,
        # since an empty web/dist still compiles.
        curl -sf http://localhost:8080/ >/dev/null \
          || { echo "::error::serves /healthz but not the embedded UI at /"; exit 1; }
        echo "ok: embedded UI served"

  # The local equivalent of the ci-radar stage, paired with it exactly as
  # build-local is paired with ci-build. Deliberately not part of `task ci`:
  # cartopy and arm-pyart compile from source, so a cold build is minutes, and
  # CI gets that back through its layer cache in a way a local run cannot.
  #
  # No --platform: on an arm64 workstation, forcing linux/amd64 runs the
  # compile under QEMU, where cc1 reproducibly dies with an internal compiler
  # error. Building natively is both the fast path and the honest one; CI
  # runners are native linux/amd64, which is the arch that actually ships.
  radar-build:
    desc: Build the radar sidecar image locally (build-only; never pushed)
    cmds:
      - docker build -f radar/Dockerfile -t stormglass-radar:local radar/

  radar-smoke:
    desc: Boot the built radar sidecar image and assert it serves
    requires:
      vars: [IMAGE]
    # Same reason as `smoke`: accepts BOTH `IMAGE=… task radar-smoke` and
    # `task radar-smoke IMAGE=…`.
    env:
      IMAGE: '{{.IMAGE}}'
    cmds:
      - |
        set -eu
        echo "smoke testing radar sidecar ${IMAGE}"
        # The issue's own minimal check first, so an import-time failure names
        # itself instead of surfacing as "never served /healthz". app.py:15
        # does `import decode` at module top, and decode.py pulls the
        # pyart/matplotlib/cartopy chain -- which is exactly how #186 failed:
        # the native extensions did not load, so uvicorn never started.
        docker run --rm --entrypoint python "${IMAGE}" -c "import decode"
        echo "ok: decode imports"
        docker run -d --name radar-smoke -p 8081:8081 "${IMAGE}"
        trap 'docker logs radar-smoke || true; docker rm -f radar-smoke >/dev/null 2>&1 || true' EXIT
        for i in $(seq 1 30); do
          curl -sf http://localhost:8081/healthz >/dev/null && break
          [ "$i" = "30" ] && { echo "::error::radar sidecar never served /healthz on :8081"; exit 1; }
          sleep 2
        done
        echo "ok: radar sidecar serves /healthz"

  # Retained from the pre-migration taskfile: the local image build is not part
  # of the CI contract but is the documented way to build by hand (CLAUDE.md).
  build-local:
    desc: Build local Docker image with dynamic labels
    env:
      BUILD_DATE:
        sh: date -u +"%Y-%m-%dT%H:%M:%SZ"
    cmds:
      - docker buildx bake image-local

  # NOTE: the template's `artifact:` task is deliberately absent. This repo ships
  # no release manifest — the container image IS the release artifact and
  # releases carry zero assets by design (PR #117). The stock task exits 1, and
  # `release-artifact` stays commented out in ci.yaml.
  #
  # The old `ui-build` task is gone: `node:build` replaces it, and `build:`
  # above sequences it ahead of `go:build` for the same embed reason.
