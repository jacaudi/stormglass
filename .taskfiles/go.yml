# Go module — checks fail on drift, never fix it. Rationale: github-actions-align/templates/README.md#goyml
version: '3'

tasks:
  ci:
    desc: All Go checks
    cmds:
      - task: fmt:check
      - task: tidy:check
      - task: lint
      - task: vuln
      - task: test

  lint:
    desc: golangci-lint
    cmds:
      - golangci-lint run

  fmt:
    desc: Format Go sources
    cmds:
      - golangci-lint fmt

  fmt:check:
    desc: Fail if sources are unformatted
    cmds:
      - golangci-lint fmt --diff

  tidy:check:
    desc: Fail if go.mod/go.sum are not tidy
    cmds:
      - go mod tidy -diff   # -diff exits non-zero; a bare `tidy` MUTATES go.mod in CI

  vuln:
    desc: Scan dependencies for known vulnerabilities
    cmds:
      # Installed pinned by the setup action; @latest would be a live fetch on
      # every run in a pipeline whose whole thesis is pinning.
      - |
        set -eu
        command -v govulncheck >/dev/null \
          || { echo "govulncheck not installed: go install golang.org/x/vuln/cmd/govulncheck@latest" >&2; exit 1; }
        govulncheck ./...

  test:
    desc: Run tests with the race detector
    cmds:
      # -tags integration is a SUPERSET, not a switch: untagged files always
      # compile, so this runs the standard suite plus the //go:build
      # integration files. It was previously omitted because the tagged suite
      # held the known-failing drain-on-close test (#111); with that fixed,
      # leaving it off is what let a real row-loss bug sit red and unseen.
      #
      # The tagged tests self-guard on POSTGRES_URL and skip when it is unset,
      # so this stays runnable locally with no database — and CI already
      # provides one (see ci-test.yml's postgres service), which is why
      # enabling this costs no new infrastructure.
      - go test ./... -race -tags integration

  build:
    desc: Build binaries into ./bin/
    cmds:
      - go build -o bin/ ./...
