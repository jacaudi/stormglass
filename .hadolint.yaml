# Fleet baseline for Dockerfile linting. Rationale: github-actions-align/templates/README.md#hadolintyaml
failure-threshold: warning

ignored:
  - DL3008  # pin apt versions — Renovate does not manage them
  - DL3018  # pin apk versions — same

trustedRegistries:
  - ghcr.io
  - docker.io
  - gcr.io
  - registry.k8s.io
  - quay.io
  # Per-repo addition to the fleet list. The final stage is
  # cgr.dev/chainguard/static, chosen deliberately: it is what keeps the image
  # static and non-root, the same constraint that makes CGO_ENABLED=0 and the
  # pure-Go SQLite driver load-bearing. Digest-pinned at the FROM, so the
  # :latest tag there is not an unpinned reference.
  - cgr.dev

override:
  error:
    - DL3006  # always tag the base image explicitly
    - DL3007  # never :latest
    - DL3020  # COPY, not ADD
