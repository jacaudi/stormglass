# The chart source for helmrelease.yaml. Skip this if you already have a
# bjw-s-labs HelmRepository in the cluster, and point the HelmRelease's
# sourceRef at the one you have.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: bjw-s-labs
  namespace: flux-system
spec:
  interval: 1h
  url: https://bjw-s-labs.github.io/helm-charts/
